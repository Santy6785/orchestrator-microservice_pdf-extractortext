services:
  mongodb:
    image: mongo:7
    container_name: pdf-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_ROOT_USERNAME:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD:-adminpassword123}"
    volumes:
      - mongodb_data:/data/db
    stop_signal: SIGTERM
    stop_grace_period: 10s
    networks:
      - pdf-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  persistence:
    build:
      context: ./persistence-microservice_pdf-extractortext
      dockerfile: Dockerfile
    container_name: pdf-persistence
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: "8000"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      MONGODB_URI: "mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-adminpassword123}@mongodb:27017/?authSource=admin"
      MONGODB_DB: "${MONGODB_DB:-persistence_db}"
      MONGODB_COLLECTION: "${MONGODB_COLLECTION:-documents}"
      MAX_PAYLOAD_SIZE_BYTES: "${MAX_PAYLOAD_SIZE_BYTES:-14680064}"
    expose:
      - "8000"
    stop_signal: SIGTERM
    stop_grace_period: 10s
    networks:
      - pdf-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  extractor:
    build:
      context: ./extractor-microservice_pdf-extractortext
      dockerfile: Dockerfile
    container_name: pdf-extractor
    restart: unless-stopped
    environment:
      EXTRACT_CONCURRENCY: "${EXTRACT_CONCURRENCY:-3}"
      EXTRACT_QUEUE_TIMEOUT: "${EXTRACT_QUEUE_TIMEOUT:-10}"
      EXTRACT_MAX_QUEUE: "${EXTRACT_MAX_QUEUE:-8}"
      EXTRACT_CACHE_SIZE: "${EXTRACT_CACHE_SIZE:-32}"
      PDF_MAX_FILE_SIZE_MB: "50"
    expose:
      - "80"
    networks:
      - pdf-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:80/health').getcode()==200 else 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    build:
      context: ./orchestrator-microservice_pdf-extractortext
      dockerfile: Dockerfile
    container_name: pdf-orchestrator
    restart: unless-stopped
    environment:
      EXTRACTOR_SERVICE_URL: "http://extractor"
      PERSISTENCE_SERVICE_URL: "http://persistence:8000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      EXTRACTOR_TIMEOUT_SECONDS: "${EXTRACTOR_TIMEOUT_SECONDS:-30}"
      PERSISTENCE_TIMEOUT_SECONDS: "${PERSISTENCE_TIMEOUT_SECONDS:-5}"
      HEALTH_TIMEOUT_SECONDS: "${HEALTH_TIMEOUT_SECONDS:-2}"
    ports:
      - "8000:8000"
    stop_signal: SIGTERM
    stop_grace_period: 20s
    networks:
      - pdf-network
    depends_on:
      persistence:
        condition: service_healthy
      extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/control/health', timeout=8)"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend-microservice_pdf-extractortext
      dockerfile: Dockerfile
    container_name: pdf-frontend
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 10s
    environment:
      API_BASE_PATH: ""
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-30000}"
      LOG_LEVEL: "info"
      ACCESS_LOG: "${ACCESS_LOG:-on}"
    expose:
      - "80"
    networks:
      - pdf-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    image: nginx:alpine
    container_name: pdf-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pdf-network
    depends_on:
      orchestrator:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  pdf-network:
    driver: bridge

volumes:
  mongodb_data:
