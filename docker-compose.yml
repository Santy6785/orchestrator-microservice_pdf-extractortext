version: '3.9'
services:
  orchestrator:
    build: .
    container_name: orchestrator
    environment:
      - EXTRACTOR_SERVICE_URL=http://extractor
      - PERSISTENCE_SERVICE_URL=http://persistence:8000
    ports:
      - "8000:8000"
    # Optional: add healthcheck if needed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/control/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
