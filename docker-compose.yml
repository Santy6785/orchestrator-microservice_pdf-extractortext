version: '3.9'
services:
  orchestrator:
    build: .
    container_name: orchestrator
    environment:
      - EXTRACTOR_SERVICE_URL=http://mock-extractor
      - PERSISTENCE_SERVICE_URL=http://mock-persistence
    ports:
      - "8000:8000"
    # Optional: add healthcheck if needed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/control/health"]
      interval: 30s
      timeout: 5s
      retries: 3
