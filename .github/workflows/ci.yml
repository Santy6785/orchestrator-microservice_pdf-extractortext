name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf [https://github.com/astral-sh/uv/releases/latest/download/uv-installer.sh](https://github.com/astral-sh/uv/releases/latest/download/uv-installer.sh) | sh
          echo "${HOME}/.local/bin:${HOME}/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run --extra dev pytest -q -m "not system"

      - name: Build Docker image
        run: docker build -t orchestrator:latest .
